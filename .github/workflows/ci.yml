name: FinIntel Continuous Integration

on:
  push:
    branches: [ main, fix/*, feature/* ]
  pull_request:
    branches: [ main, fix/*, feature/* ]

jobs:
  web-ci:
    name: Web Frontend CI (apps/web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@fe35144f98623325db005470d057790b39fbfa7f # v4.0.0
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Web Lint
        run: pnpm --filter web lint

      - name: Web Type-Check
        run: pnpm --filter web type-check

      - name: Web Vitest Component & Security Tests
        run: pnpm --filter web test

      - name: Web Production Build
        run: pnpm --filter web build

  go-api-ci:
    name: Core Go API & PostgreSQL Security CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finintel_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@f111f37a6d63100c4d3732530a4d6568462c5223 # v5.3.0
        with:
          go-version-file: services/api/go.mod

      - name: Go Formatting Check
        run: |
          UNFORMATTED=$(gofmt -s -l services/api/)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: The following Go files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        working-directory: services/api
        run: go vet ./...

      - name: Install Goose Migration Tool
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1

      - name: Bootstrap PostgreSQL Roles & Run Goose Migrations
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: finintel_dev
          PGUSER: postgres
          PGPASSWORD: postgres_dev_pass
        run: |
          psql -f database/scripts/setup_roles.sql
          psql -c "
            CREATE USER ci_owner_login WITH PASSWORD 'owner_pass' IN ROLE finintel_owner NOINHERIT;
            CREATE USER ci_app_login WITH PASSWORD 'app_pass' IN ROLE finintel_app NOINHERIT;
            CREATE USER ci_bff_login WITH PASSWORD 'bff_pass' IN ROLE finintel_bff NOINHERIT;
            GRANT finintel_owner TO ci_owner_login;
            GRANT finintel_app TO ci_app_login;
            GRANT finintel_bff TO ci_bff_login;
            ALTER DATABASE finintel_dev OWNER TO finintel_owner;
            ALTER SCHEMA public OWNER TO finintel_owner;
            GRANT ALL ON SCHEMA public TO finintel_owner;
          "
          # Pre-migration assertion: Verify connection genuinely activates finintel_owner role
          psql "postgres://ci_owner_login:owner_pass@localhost:5432/finintel_dev?sslmode=disable&options=-c%20role%3Dfinintel_owner" -c "
            DO \$\$
            BEGIN
              IF current_user != 'finintel_owner' THEN
                RAISE EXCEPTION 'Pre-migration assertion failed: current_user is %, expected finintel_owner', current_user;
              END IF;
              IF session_user != 'ci_owner_login' THEN
                RAISE EXCEPTION 'Pre-migration assertion failed: session_user is %, expected ci_owner_login', session_user;
              END IF;
            END \$\$;
          "
          goose -dir database/migrations postgres "postgres://ci_owner_login:owner_pass@localhost:5432/finintel_dev?sslmode=disable&options=-c%20role%3Dfinintel_owner" up

      - name: Run Go Unit & Security Integration Tests
        working-directory: services/api
        env:
          DATABASE_URL: postgres://ci_app_login:app_pass@localhost:5432/finintel_dev?sslmode=disable
          TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres_dev_pass@localhost:5432/finintel_dev?sslmode=disable
        run: go test -v -race -count=1 ./...

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@822e8316eb1626f864cfec1687ff025b597171d9 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi-validation:
    name: OpenAPI 3.1 Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@fe35144f98623325db005470d057790b39fbfa7f # v4.0.0
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI Contract
        run: pnpm lint:openapi

  bff-postgres-ci:
    name: Next.js BFF PostgreSQL Integration CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finintel_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@fe35144f98623325db005470d057790b39fbfa7f # v4.0.0
        with:
          version: 10

      - name: Setup Go
        uses: actions/setup-go@f111f37a6d63100c4d3732530a4d6568462c5223 # v5.3.0
        with:
          go-version-file: services/api/go.mod

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Goose Migration Tool
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1

      - name: Bootstrap PostgreSQL Roles & Run Goose Migrations
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: finintel_dev
          PGUSER: postgres
          PGPASSWORD: postgres_dev_pass
        run: |
          psql -f database/scripts/setup_roles.sql
          psql -c "
            CREATE USER ci_owner_login WITH PASSWORD 'owner_pass' IN ROLE finintel_owner NOINHERIT;
            CREATE USER ci_bff_login WITH PASSWORD 'bff_pass' IN ROLE finintel_bff NOINHERIT;
            GRANT finintel_owner TO ci_owner_login;
            GRANT finintel_bff TO ci_bff_login;
            ALTER DATABASE finintel_dev OWNER TO finintel_owner;
            ALTER SCHEMA public OWNER TO finintel_owner;
            GRANT ALL ON SCHEMA public TO finintel_owner;
          "
          goose -dir database/migrations postgres "postgres://ci_owner_login:owner_pass@localhost:5432/finintel_dev?sslmode=disable&options=-c%20role%3Dfinintel_owner" up

      - name: Run BFF PostgreSQL Integration Suite
        env:
          BFF_DATABASE_URL: postgres://ci_bff_login:bff_pass@localhost:5432/finintel_dev?sslmode=disable
          TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres_dev_pass@localhost:5432/finintel_dev?sslmode=disable
          SESSION_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
          APPLICATION_ORIGIN: http://localhost:3000
          OIDC_ISSUER_URL: https://auth.finintel.internal
          OIDC_CLIENT_ID: finintel-web-bff
          OIDC_CLIENT_SECRET: placeholder_bff_client_secret_32chars
        run: pnpm --filter web test:integration
